name: micromantid

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  release:
    types: [published]
  workflow_dispatch:

defaults:
  run:
    shell: bash -l {0}

jobs:
  build_container:
    name: Creates the build container with emsdk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get container digest
        run: |
          B64TOKEN=$(echo "mducle:${{  secrets.GH_PACKAGE_TOKEN }}" | base64)
          TOKURL="https://ghcr.io/token?service=ghcr.io&scope=repository:mducle/micromantid_build:pull"
          MANURL="https://ghcr.io/v2/mducle/micromantid_build/manifests/latest"
          APPID="Accept: application/vnd.oci.image.manifest.v1+json"
          AUTHTOK=$(curl -H "Authorization: Basic $B64TOKEN" $TOKURL | awk -F'"' '$0=$4')
          MD5SUM=$(curl -H "Authorization: Bearer $AUTHTOK" -H "$APPID" "$MANURL" | md5sum | awk '{print $1}')
      - name: Build and push container
        run: |
          echo ${{  secrets.GH_PACKAGE_TOKEN }}| docker login ghcr.io -u mducle --password-stdin
          docker build -t ghcr.io/mducle/micromantid_build:latest .
          docker image push ghcr.io/mducle/micromantid_build:latest
      #- name: Setup tmate
      #  uses: mxschmitt/action-tmate@v3

  build_and_test:
    name: Builds and test Pyodide wheel
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mducle/micromantid_build:latest
      credentials:
        username: mducle
        password: ${{  secrets.GH_PACKAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Patch mantid
        run: |
          cd mantid
          for dd in ../diffs/*; do
            patch -p1 < $dd
          done
          cd ..
      - name: Build
        run: |
          eval "$($MAMBA_EXE shell activate base --shell=bash)"
          export PYODIDE_EMSCRIPTEN_VERSION=$(pyodide config get emscripten_version)
          export SIDE_MODULE_CXXFLAGS=$(pyodide config get cxxflags)
          export SIDE_MODULE_CFLAGS=$(pyodide config get cflags)
          export SIDE_MODULE_LDFLAGS=$(pyodide config get ldflags)
          export PLATFORM_TRIPLET=wasm32-emscripten
          source /tmp/build_env/emsdk/emsdk_env.sh
          pyodide build
      - name: Test
        run: |
          wd=`pwd`
          cd tests && mkdir build && cd build && cmake .. && make TestWheel
          cd $wd/instrument && mkdir build && cd build && cmake .. && make InstrumentWheel
          cd $wd/tests/testhelpers && pyodide build
          cd $wd
          npm install
          npm test
      #- name: Setup tmate
      #  if: ${{ failure() }}
      #  uses: mxschmitt/action-tmate@v3
      - uses: actions/upload-artifact@v4
        with:
          name: wheels.zip
          path: |
            dist/*
            tests/testhelpers/dist/*
